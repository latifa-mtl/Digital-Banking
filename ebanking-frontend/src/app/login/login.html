<div class="login-page">
  <div class="login-bg">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
  </div>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="6" width="20" height="13" rx="2"/>
          <path d="M7 6V4a1 1 0 011-1h8a1 1 0 011 1v2"/>
          <path d="M12 11v4M10 13h4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">BankOS</div>
        <div class="brand-sub">Secure Banking Platform</div>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-desc">Sign in to your account to continue</p>

    <div class="alert error" *ngIf="errorMsg">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMsg }}
    </div>

    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrap" [class.focused]="userFocused">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="username" name="username" type="text"
          [(ngModel)]="username" placeholder="e.g. admin"
          (focus)="userFocused=true" (blur)="userFocused=false"
          (keydown.enter)="login()" class="form-input" autocomplete="username"/>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap" [class.focused]="passFocused">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <input id="password" name="password"
          [type]="showPass ? 'text' : 'password'"
          [(ngModel)]="password" placeholder="••••••••"
          (focus)="passFocused=true" (blur)="passFocused=false"
          (keydown.enter)="login()" class="form-input" autocomplete="current-password"/>
        <button class="eye-btn" type="button" (click)="showPass=!showPass">
          <svg *ngIf="!showPass" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showPass"  width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-login" (click)="login()" [disabled]="loading">
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading" class="spin"></span>
    </button>

    <p class="hint">Default users: <strong>admin / 12345</strong> &nbsp;·&nbsp; <strong>user1 / 12345</strong></p>
  </div>
</div>
