<div class="page">
  <div class="page-header">
    <div>
      <h1>Customers</h1>
      <p class="subtitle">{{ filtered.length }} of {{ customers.length }} customers</p>
    </div>
    <a routerLink="/new-customer" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New Customer
    </a>
  </div>

  <div class="alert success" *ngIf="successMsg">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    {{ successMsg }}
  </div>
  <div class="alert error" *ngIf="errorMsg">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    {{ errorMsg }}
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search by name or email..."
        [(ngModel)]="searchKeyword"
        (ngModelChange)="onSearch()"
        (keyup.enter)="onServerSearch()"
      />
      <button class="search-btn" (click)="onServerSearch()">Search</button>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading customers...</p>
  </div>

  <div class="table-wrap" *ngIf="!loading">
    <table class="data-table" *ngIf="filtered.length > 0">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Email</th>
          <th>ID</th>
          <th class="th-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of filtered">
          <td>
            <div class="cell-customer">
              <div class="avatar" [style.background]="getAvatarColor(c.name)">{{ getInitial(c.name) }}</div>
              <span class="cname">{{ c.name }}</span>
            </div>
          </td>
          <td class="cell-email">{{ c.email }}</td>
          <td class="cell-id">#{{ c.id }}</td>
          <td class="cell-actions">
            <button class="icon-btn edit" (click)="openEdit(c)" title="Edit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="icon-btn delete" (click)="deleteCustomer(c.id!)" title="Delete">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" *ngIf="filtered.length === 0">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c5cfe8" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a4 4 0 014-4h8a4 4 0 014 4v2"/></svg>
      <p>No customers found</p>
      <a routerLink="/new-customer" class="btn-primary">Add first customer</a>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" *ngIf="showEditModal" (click)="closeEdit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Edit Customer</h3>
      <button class="modal-close" (click)="closeEdit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" *ngIf="editingCustomer">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="edit-name" [(ngModel)]="editingCustomer.name" class="form-input" placeholder="Enter name" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="edit-email" [(ngModel)]="editingCustomer.email" class="form-input" placeholder="Enter email" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" (click)="closeEdit()">Cancel</button>
      <button class="btn-primary" (click)="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>
